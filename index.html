<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Santa</title>
<style>
:root{--bg:#fbf7f2;--fg:#2a2420;--card:#fff;--line:#e3d9cf;--accent:#b3202a;--muted:#7a6f66;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1816;--fg:#f3ece5;--card:#26211e;--line:#3a332e;--accent:#e5535c;--muted:#a59a91}}
:root[data-theme="dark"]{--bg:#1c1816;--fg:#f3ece5;--card:#26211e;--line:#3a332e;--accent:#e5535c;--muted:#a59a91}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.8rem;margin:0 0 4px}
p{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 12px}
input{font:inherit;width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{margin-bottom:12px}
.row b{display:block;margin-bottom:4px}
.pair{display:flex;gap:8px}
.big{font-size:2rem;color:var(--accent);margin:12px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
var people=["Michael","Madison","Kevin","Stacy","Christina","Bailey"];
var partner={Michael:"Madison",Madison:"Michael",Kevin:"Stacy",Stacy:"Kevin",Christina:"Bailey",Bailey:"Christina"};
var KEY=90;
function enc(s){var b=new TextEncoder().encode(s),o="";for(var i=0;i<b.length;i++){o+=("0"+(b[i]^KEY).toString(16)).slice(-2);}return o;}
function dec(h){var a=[];for(var i=0;i<h.length;i+=2){a.push(parseInt(h.substr(i,2),16)^KEY);}return new TextDecoder().decode(new Uint8Array(a));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function draw(){
  while(true){
    var r=shuffle(people),ok=true;
    for(var i=0;i<people.length;i++){if(r[i]===people[i]||r[i]===partner[people[i]]){ok=false;break;}}
    if(ok){return r;}
  }
}
var app=document.getElementById("app");
var tokens=null;
function view(){
  var h=location.hash.slice(1);
  if(/^[0-9a-f]+$/.test(h)&&h.length%2===0){return reveal(h);}
  return organizer();
}
function reveal(h){
  var giver="",recv="";
  try{var p=dec(h).split("|");giver=p[0];recv=p[1];}catch(e){}
  if(!giver||!recv){app.innerHTML="<h1>Hmm…</h1><p>This link doesn’t look right. Ask the organizer for a new one.</p>";return;}
  app.innerHTML="<h1>Secret Santa</h1><div class='card'><p>Hi "+giver+"! Ready to see who you’re buying for? Make sure nobody is looking over your shoulder.</p><button id='go'>Reveal my match</button><div id='out'></div></div>";
  document.getElementById("go").onclick=function(){
    document.getElementById("out").innerHTML="<div class='big'>"+recv+"</div><p>Keep it secret!</p>";
    this.style.display="none";
  };
}
function organizer(){
  var base="";
  try{base=location.href.split("#")[0];}catch(e){}
  var html="<h1>Secret Santa</h1><p>Draws names with the couple rules applied. You’ll only see links, not who drew whom.</p>";
  html+="<div class='card'><button id='draw'>"+(tokens?"Draw again":"Draw names")+"</button></div>";
  if(tokens){
    html+="<div class='card'><div class='row'><b>Shared page link</b><input id='base' value='"+base+"'></div><p>Make sure this is the page’s shared link, then send each person their own link below.</p><div id='links'></div></div>";
  }
  app.innerHTML=html;
  document.getElementById("draw").onclick=function(){
    var r=draw();tokens={};
    for(var i=0;i<people.length;i++){tokens[people[i]]=enc(people[i]+"|"+r[i]);}
    organizer();
  };
  if(tokens){
    var baseEl=document.getElementById("base");
    var render=function(){
      var out="";
      people.forEach(function(n){
        var url=baseEl.value.split("#")[0]+"#"+tokens[n];
        out+="<div class='row'><b>"+n+"</b><div class='pair'><input readonly value='"+url+"'><button class='alt' data-u='"+url+"'>Copy</button></div></div>";
      });
      var box=document.getElementById("links");box.innerHTML=out;
      var bs=box.querySelectorAll("button");
      for(var i=0;i<bs.length;i++){bs[i].onclick=function(){
        var u=this.getAttribute("data-u"),b=this;
        try{navigator.clipboard.writeText(u).then(function(){b.textContent="Copied";});}catch(e){b.textContent="Select & copy";}
      };}
    };
    baseEl.oninput=render;render();
  }
}
window.addEventListener("hashchange",view);
view();
</script>
</body>
</html>
